<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:76px}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top h1{font-size:21px}.top button{background:none;border:0;color:#eee;font-size:23px}.tabs{display:flex;overflow:auto}.tabs button{background:none;border:0;color:#999;padding:14px 12px;border-bottom:2px solid transparent}.tabs .active{color:#f33;border-color:#f33}.actions{padding:15px 18px;display:flex;justify-content:space-between}.song{display:grid;grid-template-columns:48px 1fr 34px;gap:12px;padding:10px 18px;border-bottom:1px solid #1d1d1d;align-items:center}.art{width:48px;height:48px;border-radius:7px;background:linear-gradient(145deg,#ff3b30,#ff9a00);display:grid;place-items:center;font-size:25px}.song small{display:block;color:#888;margin-top:5px}.song button{background:none;border:0;color:#aaa;font-size:22px}.empty{text-align:center;color:#777;padding:100px 20px}.mini{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#181818;display:grid;grid-template-columns:45px 1fr 42px 42px;gap:8px;align-items:center;padding:8px 12px;z-index:5}.mini .art{width:45px;height:45px}.mini small{display:block;color:#999}.mini button{background:none;border:0;color:#fff;font-size:20px}.sheet{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:end}.sheet>div{width:min(520px,100%);background:#1c1c1e;border-radius:22px 22px 0 0;padding:10px 18px 28px}.sheet button{display:block;width:100%;padding:17px 4px;background:none;border:0;border-bottom:1px solid #333;color:#eee;text-align:left}.danger{color:#ff453a!important}.scan{text-align:center;padding:25px}.scan .big{font-size:70px;color:#f33}.scan p{color:#888}.scanbtn{background:#ef4b43!important;color:#fff!important;border-radius:25px;text-align:center!important}.player{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#293b75,#070721 65%);z-index:15;padding:14px 18px}.cover{width:min(320px,75vw);aspect-ratio:1;margin:35px auto 25px;border-radius:18px;background:linear-gradient(145deg,#1549aa,#44205f);display:grid;place-items:center;font-size:100px}.pt{text-align:center}.pt h2{font-size:20px}.pt p{color:#aaa}.range{width:100%;accent-color:#f33}.controls{display:flex;justify-content:space-around;align-items:center;margin:25px 0}.controls button{background:none;border:0;color:#fff;font-size:24px}.controls .main{width:62px;height:62px;border-radius:50%;background:#fff;color:#000}.tools{display:flex;justify-content:space-around}.tools button{background:none;border:0;color:#ddd}.search{padding:12px 18px}.search input{width:100%;padding:12px;border-radius:22px;background:#151515;border:1px solid #333;color:#fff}
